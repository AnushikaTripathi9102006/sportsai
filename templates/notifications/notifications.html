{% extends 'base.html' %}

{% block title %}Notifications - KisanFlow{% endblock %}

{% block content %}
<div class="space-y-6 max-w-4xl mx-auto pb-12">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs">
        <div>
            <span class="text-xs font-bold uppercase tracking-widest text-emerald-600">Communication Center</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">🔔 Notifications</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Stay updated with live procurement, token queue, and payout alerts.</p>
        </div>
        <a href="{% url 'notifications:notifications' %}" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-semibold text-xs hover:bg-emerald-800 transition-colors shadow-xs">
            Open Notifications Center &rarr;
        </a>
    </div>
</div>
{% endblock %}
