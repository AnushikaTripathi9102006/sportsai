{% extends 'base.html' %}

{% block title %}Procurement Details - KisanFlow{% endblock %}

{% block content %}
<div class="space-y-6 max-w-5xl mx-auto pb-12">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-xs">
        <div>
            <a href="{% url 'procurement:status' %}" class="inline-flex items-center gap-2 text-xs font-semibold text-emerald-700 hover:text-emerald-800 mb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Back to Status
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">📦 Procurement Details</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Detailed view of your procurement stages and calculations.</p>
        </div>
        <a href="{% url 'procurement:status_detail' %}" class="px-5 py-2.5 rounded-xl bg-emerald-700 text-white font-semibold text-xs hover:bg-emerald-800 transition-colors shadow-xs">
            Open Interactive Tracker &rarr;
        </a>
    </div>
</div>
{% endblock %}
